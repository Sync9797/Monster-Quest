name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# One build per branch at a time, in order, so an older run can't overwrite
# a newer run's release or screenshots.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Ubuntu 24.04 runners come with the Android SDK preinstalled.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Point Gradle at the Android SDK
        run: echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > local.properties

      - name: Test game engine
        run: ./gradlew :core:test

      - name: Build APK
        shell: bash
        run: ./gradlew :app:assembleDebug 2>&1 | tee build.log

      # Logs need a GitHub login to view; push them to a branch so failures can
      # be diagnosed from anywhere.
      - name: Publish build log on failure
        if: failure() && github.event_name == 'push'
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p logs && cp build.log logs/ 2>/dev/null || echo "no log" > logs/build.log
          cd logs
          git init -q
          git checkout -q -b ci-logs
          git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "Build log for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonsterQuest-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # On every push to main, publish the APK as the "latest" release so it can
      # be downloaded straight from your phone's browser.
      - name: Publish latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MonsterQuest.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest MonsterQuest.apk \
            --title "Latest build ($(git rev-parse --short HEAD))" \
            --notes "Automatic build of ${GITHUB_SHA}. Download MonsterQuest.apk on your Android phone and open it to install." \
            --target "${GITHUB_SHA}"

      # When versionName changes, also publish a permanent release for that
      # version (e.g. v0.2.0) with its notes from CHANGELOG.md.
      - name: Publish versioned release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION already released"
            exit 0
          fi
          cp app/build/outputs/apk/debug/app-debug.apk "MonsterQuest-$VERSION.apk"
          awk -v v="## $VERSION" '$0 == v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          gh release create "v$VERSION" "MonsterQuest-$VERSION.apk" \
            --title "Monster Quest $VERSION" \
            --notes-file notes.md \
            --target "${GITHUB_SHA}"

      # Render every screen at foldable/phone sizes and publish the PNGs to the
      # `screenshots` branch for layout review.
      - name: Render screenshots
        id: render
        continue-on-error: true
        shell: bash
        # --rerun: always render, even when Gradle could reuse earlier test results.
        run: ./gradlew :app:testDebugUnitTest --rerun 2>&1 | tee render.log

      - name: Publish screenshots
        if: always() && github.event_name == 'push'
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p shots
          cp app/build/screenshots/*.png shots/ 2>/dev/null || true
          mkdir -p shots/results
          cp app/build/test-results/testDebugUnitTest/*.xml shots/results/ 2>/dev/null || true
          cd shots
          git init -q
          git checkout -q -b screenshots
          git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "Screenshots for ${GITHUB_SHA}" || exit 0
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" screenshots

      # A failed screenshot run (compile error or failing UI test) fails the
      # build, after publishing what it could and pushing its log to ci-logs.
      - name: Publish screenshot log on failure
        if: steps.render.outcome == 'failure' && github.event_name == 'push'
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p rlogs && cp render.log rlogs/build.log
          cd rlogs
          git init -q
          git checkout -q -b ci-logs
          git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "Screenshot log for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs

      - name: Fail if screenshots failed
        if: steps.render.outcome == 'failure'
        run: exit 1
