name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Ubuntu 24.04 runners come with the Android SDK preinstalled.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Point Gradle at the Android SDK
        run: echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > local.properties

      - name: Test game engine
        run: ./gradlew :core:test

      - name: Build APK
        shell: bash
        run: ./gradlew :app:assembleDebug 2>&1 | tee build.log

      # Logs need a GitHub login to view; push them to a branch so failures can
      # be diagnosed from anywhere.
      - name: Publish build log on failure
        if: failure() && github.event_name == 'push'
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p logs && cp build.log logs/ 2>/dev/null || echo "no log" > logs/build.log
          cd logs
          git init -q
          git checkout -q -b ci-logs
          git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "Build log for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonsterQuest-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # On every push to main, publish the APK as the "latest" release so it can
      # be downloaded straight from your phone's browser.
      - name: Publish latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MonsterQuest.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest MonsterQuest.apk \
            --title "Latest build ($(git rev-parse --short HEAD))" \
            --notes "Automatic build of ${GITHUB_SHA}. Download MonsterQuest.apk on your Android phone and open it to install." \
            --target "${GITHUB_SHA}"

      # Render every screen at foldable/phone sizes and publish the PNGs to the
      # `screenshots` branch for layout review.
      - name: Render screenshots
        continue-on-error: true
        run: ./gradlew :app:testDebugUnitTest

      - name: Publish screenshots
        if: always() && github.event_name == 'push'
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p shots
          cp app/build/screenshots/*.png shots/ 2>/dev/null || true
          mkdir -p shots/results
          cp app/build/test-results/testDebugUnitTest/*.xml shots/results/ 2>/dev/null || true
          cd shots
          git init -q
          git checkout -q -b screenshots
          git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "Screenshots for ${GITHUB_SHA}" || exit 0
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" screenshots
